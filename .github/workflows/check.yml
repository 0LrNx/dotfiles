name: check

# Vérifie que les templates se rendent et que `chezmoi apply` passe en simulation
# sur les trois OS. Aucun script d'installation de paquets n'est exécuté.
on:
  push:
  pull_request:

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Installer chezmoi
        shell: bash
        run: go install github.com/twpayne/chezmoi/v2@latest

      - name: chezmoi init + apply (simulation)
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          chezmoi init --source "$GITHUB_WORKSPACE" \
            --promptString "name=CI,email=ci@example.com,workEmail=ci@work.example.com,signingKey=ABCDEF1234"
          chezmoi --source "$GITHUB_WORKSPACE" apply --dry-run --verbose --exclude=scripts
